name: Release

# Runs whenever a version tag (v0.5.6, v0.6.0, ...) is pushed. Builds an
# installer on both Windows and macOS runners and publishes them together
# to a GitHub Release matching the tag — that release is what the app's
# built-in auto-updater (electron-updater) checks against.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx electron-vite build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
